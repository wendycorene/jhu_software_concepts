name: Module 4 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: module_4
        shell: bash

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gradcafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-test-only
      PGDATABASE: gradcafe_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            module_4/requirements.txt
            module_4/src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run all marked tests with coverage
        # Explicit bash enables pipefail, so tee cannot hide a test failure.
        run: |
          python -m pytest -m "web or buttons or analysis or db or integration" -q -p no:cacheprovider 2>&1 | tee coverage_summary.txt
